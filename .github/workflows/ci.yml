name: CI

on:
  push:
    branches: [trunk, master]
  pull_request:

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest

    container:
      image: node:25.2.1-trixie-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci --include=dev
          ls node_modules

      - name: Cache node_modules
        uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install

    container:
      image: node:25.2.1-trixie-slim

    steps:
      - uses: actions/checkout@v4

      - name: Restore node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Build
        run: |
          ls node_modules
          npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    continue-on-error: true

    container:
      image: node:25.2.1-trixie-slim

    steps:
      - uses: actions/checkout@v4

      - name: Restore node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Lint
        run: npm run lint

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/your-frontend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/your-frontend:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/your-frontend:latest
